<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My account | PrimeLane</title>
  <link rel="icon" href="/multimedia/imgi_17_best-ecommerce-website-design-cover.jpg">
  <link rel="stylesheet" href="/css/styles.css">
  <script>try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}</script>
</head>

<body data-page="account" data-requires-auth class="flex min-h-screen flex-col">
  <div id="site-header"></div>

  <main id="main" class="flex-1">
    <div class="container-page py-8 md:py-12">
      <div class="flex items-center gap-4">
        <span id="accountAvatar" class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-indigo-600 text-xl font-bold text-white" aria-hidden="true"></span>
        <div class="min-w-0">
          <h1 class="truncate text-2xl font-bold md:text-3xl" id="accountName">My account</h1>
          <p class="truncate text-sm text-gray-500 dark:text-gray-400" id="accountEmail"></p>
        </div>
      </div>

      <div class="mt-8 grid gap-8 lg:grid-cols-[14rem_1fr]">
        <nav aria-label="Account sections" class="-mx-4 overflow-x-auto px-4 lg:mx-0 lg:px-0">
          <ul class="flex gap-2 lg:flex-col">
            <li><a href="#orders" data-tab="orders" class="block whitespace-nowrap rounded-lg px-4 py-2.5 text-sm font-medium">My orders</a></li>
            <li><a href="#profile" data-tab="profile" class="block whitespace-nowrap rounded-lg px-4 py-2.5 text-sm font-medium">Profile & address</a></li>
            <li><button type="button" data-logout class="block w-full whitespace-nowrap rounded-lg px-4 py-2.5 text-left text-sm font-medium text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950/40">Sign out</button></li>
          </ul>
        </nav>

        <div>
          <section id="panel-orders" aria-labelledby="orders-heading" hidden>
            <h2 id="orders-heading" class="mb-4 text-xl font-semibold">My orders</h2>
            <div id="ordersList" aria-busy="true"></div>
          </section>

          <section id="panel-profile" aria-labelledby="profile-heading" hidden>
            <h2 id="profile-heading" class="mb-4 text-xl font-semibold">Profile & delivery address</h2>
            <form id="profileForm" class="card space-y-4 p-6" novalidate>
              <div class="grid gap-4 sm:grid-cols-2">
                <div><label for="pf-fullName" class="label">Full name</label><input id="pf-fullName" name="fullName" class="input" autocomplete="name" maxlength="100"></div>
                <div><label for="pf-email" class="label">Email</label><input id="pf-email" name="email" type="email" class="input bg-gray-100 dark:bg-gray-800" disabled></div>
                <div><label for="pf-phone" class="label">Phone number</label><input id="pf-phone" name="phone" type="tel" class="input" autocomplete="tel" maxlength="20"></div>
              </div>
              <div><label for="pf-address" class="label">Street address</label><input id="pf-address" name="address" class="input" autocomplete="street-address" maxlength="200"></div>
              <div class="grid gap-4 sm:grid-cols-3">
                <div><label for="pf-city" class="label">City</label><input id="pf-city" name="city" class="input" autocomplete="address-level2" maxlength="100"></div>
                <div><label for="pf-state" class="label">State</label><input id="pf-state" name="state" class="input" list="ng-states" autocomplete="address-level1" maxlength="100"></div>
                <div><label for="pf-country" class="label">Country</label><input id="pf-country" name="country" class="input" autocomplete="country-name" maxlength="100"></div>
              </div>
              <datalist id="ng-states"></datalist>
              <p class="text-sm text-gray-500">These details fill in automatically at checkout. To change your email or password, contact support or use “Forgot password?” on the login page.</p>
              <div class="flex justify-end"><button type="submit" class="btn-primary">Save changes</button></div>
            </form>
          </section>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="/js/account.js"></script>
</body>

</html>
