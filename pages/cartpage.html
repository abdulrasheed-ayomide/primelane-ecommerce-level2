<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your cart | PrimeLane</title>
  <link rel="icon" href="/multimedia/imgi_17_best-ecommerce-website-design-cover.jpg">
  <link rel="stylesheet" href="/css/styles.css">
  <script>try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}</script>
</head>

<body data-page="cart" class="flex min-h-screen flex-col">
  <div id="site-header"></div>

  <main id="main" class="flex-1">
    <div class="container-page py-8 md:py-12">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <h1 class="text-3xl font-bold">Your cart</h1>
        <a href="/pages/shop.html" class="text-sm font-semibold text-indigo-600 hover:underline dark:text-indigo-400">← Continue shopping</a>
      </div>

      <div id="cartNotice" class="mt-6 hidden rounded-lg border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900 dark:border-amber-900 dark:bg-amber-950/40 dark:text-amber-100" role="status"></div>

      <div id="cartLayout" class="mt-6 grid gap-8 lg:grid-cols-[1fr_22rem]">
        <section aria-labelledby="items-heading">
          <h2 id="items-heading" class="sr-only">Items</h2>
          <ul id="cartPageContainer" class="divide-y divide-gray-200 rounded-xl border border-gray-200 bg-white dark:divide-gray-800 dark:border-gray-800 dark:bg-gray-900"></ul>
          <div id="cartActions" class="mt-4 flex justify-end">
            <button type="button" id="clearCartBtn" class="btn-ghost text-red-600 dark:text-red-400">Remove all items</button>
          </div>
        </section>

        <aside id="cartSummary" aria-labelledby="summary-heading" class="self-start lg:sticky lg:top-24">
          <div class="card p-6">
            <h2 id="summary-heading" class="text-lg font-semibold">Order summary</h2>
            <dl class="mt-4 space-y-3 text-sm">
              <div class="flex justify-between"><dt class="text-gray-600 dark:text-gray-400">Subtotal (<span id="itemCount">0</span> items)</dt><dd id="subtotal" class="font-medium">—</dd></div>
              <div class="flex justify-between"><dt class="text-gray-600 dark:text-gray-400">Delivery</dt><dd id="delivery" class="font-medium">—</dd></div>
              <div class="flex justify-between border-t border-gray-200 pt-3 text-base font-bold dark:border-gray-800"><dt>Total</dt><dd id="grandTotal">—</dd></div>
            </dl>
            <p id="freeDeliveryHint" class="mt-3 hidden rounded-lg bg-green-50 p-3 text-xs text-green-800 dark:bg-green-950/40 dark:text-green-200"></p>
            <a href="/pages/checkout.html" id="checkoutBtn" class="btn-primary btn-lg mt-6 w-full">Proceed to checkout</a>
            <p class="mt-3 text-center text-xs text-gray-500">Prices are confirmed at checkout.</p>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="/js/cartpage.js"></script>
</body>

</html>
