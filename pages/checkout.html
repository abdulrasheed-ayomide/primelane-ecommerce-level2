<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | PrimeLane</title>
  <link rel="icon" href="/multimedia/imgi_17_best-ecommerce-website-design-cover.jpg">
  <link rel="stylesheet" href="/css/styles.css">
  <script>try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}</script>
</head>

<body data-page="checkout" data-requires-auth class="flex min-h-screen flex-col">
  <div id="site-header"></div>

  <main id="main" class="flex-1">
    <div class="container-page py-8 md:py-12">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <h1 class="text-3xl font-bold">Checkout</h1>
        <p class="flex items-center gap-1.5 text-sm font-medium text-green-700 dark:text-green-400">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
          Secure checkout
        </p>
      </div>

      <div id="checkoutRoot" class="mt-6">
        <div class="grid gap-8 lg:grid-cols-[1fr_24rem]" aria-hidden="true">
          <div class="skeleton h-96 rounded-xl"></div>
          <div class="skeleton h-72 rounded-xl"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="/js/checkout.js"></script>
</body>

</html>
