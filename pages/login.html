<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | PrimeLane</title>
  <link rel="icon" href="/multimedia/imgi_17_best-ecommerce-website-design-cover.jpg">
  <link rel="stylesheet" href="/css/styles.css">
  <script>try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}</script>
</head>

<body class="flex min-h-screen items-center justify-center bg-gray-50 p-4 dark:bg-gray-950">
  <main id="main" class="w-full max-w-md">
    <a href="/index.html" class="mb-6 flex justify-center" aria-label="PrimeLane home">
      <img src="/multimedia/image.png" alt="PrimeLane" class="h-12 w-auto">
    </a>

    <div class="card overflow-hidden shadow-xl">
      <div class="bg-linear-to-r from-indigo-600 to-indigo-800 px-6 py-8 text-center">
        <h1 class="text-2xl font-bold text-white sm:text-3xl">Welcome back</h1>
        <p class="mt-1 text-sm text-indigo-100">Log in to your PrimeLane account</p>
      </div>

      <form id="loginForm" class="space-y-5 p-6 md:p-8" novalidate>
        <div id="formNotice" class="hidden rounded-lg bg-green-50 p-3 text-sm text-green-800 dark:bg-green-950/50 dark:text-green-200" role="status"></div>
        <div id="formError" class="hidden rounded-lg bg-red-50 p-3 text-sm text-red-700 dark:bg-red-950/50 dark:text-red-300" role="alert"></div>

        <!-- Shown when the password is right but the email address isn't verified yet -->
        <div id="verifyPanel" class="hidden rounded-lg border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900 dark:border-amber-900 dark:bg-amber-950/40 dark:text-amber-100" role="alert">
          <p class="font-semibold">Please verify your email address before logging in.</p>
          <p class="mt-1">Check your inbox for the verification email we sent to <strong id="verifyEmail" class="break-all"></strong>. If you can't find it, look in your spam folder.</p>
          <div class="mt-3 flex flex-col gap-2 sm:flex-row">
            <button type="button" id="checkVerifiedBtn" class="btn-primary">I've verified my email</button>
            <button type="button" id="resendBtn" class="btn-secondary">Resend verification email</button>
          </div>
          <p id="resendStatus" class="mt-2 text-xs" aria-live="polite"></p>
          <button type="button" id="switchAccountBtn" class="mt-1 text-xs font-medium underline">Use a different account</button>
        </div>
        <div>
          <label for="email" class="label">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" class="input" required>
        </div>
        <div>
          <div class="flex items-center justify-between">
            <label for="password" class="label">Password</label>
            <button type="button" id="forgotBtn" class="mb-1.5 text-sm font-medium text-indigo-600 hover:underline dark:text-indigo-400">Forgot password?</button>
          </div>
          <div class="relative">
            <input id="password" name="password" type="password" autocomplete="current-password" class="input pr-16" required>
            <button type="button" data-toggle-password="password" class="absolute inset-y-0 right-0 px-3 text-sm font-medium text-gray-500 hover:text-gray-800 dark:hover:text-gray-200" aria-label="Show password">Show</button>
          </div>
        </div>
        <button type="submit" class="btn-primary btn-lg w-full">Log in</button>
        <p class="text-center text-sm text-gray-600 dark:text-gray-400">
          Don't have an account? <a href="/pages/signup.html" id="signupLink" class="font-medium text-indigo-600 hover:underline dark:text-indigo-400">Sign up</a>
        </p>
      </form>
    </div>

    <p class="mt-6 text-center"><a href="/index.html" class="text-sm text-gray-600 hover:text-indigo-600 dark:text-gray-400">← Back to home</a></p>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>

</html>
