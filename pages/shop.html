<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | PrimeLane</title>
  <meta name="description" content="Browse PrimeLane products by category, price and rating.">
  <link rel="icon" href="/multimedia/imgi_17_best-ecommerce-website-design-cover.jpg">
  <link rel="stylesheet" href="/css/styles.css">
  <script>try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}</script>
</head>

<body data-page="shop" class="flex min-h-screen flex-col">
  <div id="site-header"></div>

  <main id="main" class="flex-1">
    <section class="border-b border-gray-200 bg-linear-to-r from-indigo-50 to-purple-50 py-8 md:py-10 dark:border-gray-800 dark:from-gray-900 dark:to-gray-950">
      <div class="container-page">
        <nav aria-label="Breadcrumb" class="text-sm text-gray-500 dark:text-gray-400">
          <a href="/index.html" class="hover:text-indigo-600">Home</a> <span aria-hidden="true">/</span> <span>Shop</span>
        </nav>
        <h1 id="shopTitle" class="mt-2 text-3xl font-bold text-gray-900 md:text-4xl dark:text-white">All products</h1>
        <p class="mt-1 text-gray-600 dark:text-gray-300">Browse our collection of quality products.</p>
      </div>
    </section>

    <div class="container-page py-6 md:py-8">
      <!-- Toolbar -->
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
        <div class="relative flex-1">
          <label for="searchInput" class="sr-only">Search products</label>
          <svg class="pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-gray-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.2-5.2m0 0A7.5 7.5 0 105.2 5.2a7.5 7.5 0 0010.6 10.6z"/></svg>
          <input id="searchInput" type="search" placeholder="Search by name, brand or category…" class="input pl-10" autocomplete="off">
        </div>
        <div class="flex gap-3">
          <button type="button" id="filtersToggle" class="btn-secondary flex-1 lg:hidden" aria-expanded="false" aria-controls="filtersPanel">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75"/></svg>
            Filters <span id="filterCount" class="badge hidden bg-indigo-600 text-white"></span>
          </button>
          <label for="sortSelect" class="sr-only">Sort by</label>
          <select id="sortSelect" class="input flex-1 sm:w-52 sm:flex-none">
            <option value="featured">Sort: Featured</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="rating">Top rated</option>
            <option value="discount">Biggest discount</option>
            <option value="name">Name: A–Z</option>
            <option value="name-desc">Name: Z–A</option>
          </select>
        </div>
      </div>

      <div class="mt-6 grid gap-8 lg:grid-cols-[16rem_1fr]">
        <!-- Filters: collapsible panel on mobile, sidebar on desktop -->
        <aside id="filtersPanel" class="hidden lg:block" aria-label="Filters">
          <div class="card space-y-6 p-5 lg:sticky lg:top-24">
            <fieldset>
              <legend class="mb-3 text-sm font-semibold">Category</legend>
              <div id="categoryList" class="max-h-72 space-y-1 overflow-y-auto pr-1"></div>
            </fieldset>

            <fieldset>
              <legend class="mb-3 text-sm font-semibold">Price (₦)</legend>
              <div class="flex items-center gap-2">
                <label for="minPrice" class="sr-only">Minimum price</label>
                <input id="minPrice" type="number" min="0" inputmode="numeric" placeholder="Min" class="input">
                <span class="text-gray-400" aria-hidden="true">–</span>
                <label for="maxPrice" class="sr-only">Maximum price</label>
                <input id="maxPrice" type="number" min="0" inputmode="numeric" placeholder="Max" class="input">
              </div>
            </fieldset>

            <fieldset class="space-y-3">
              <legend class="mb-3 text-sm font-semibold">Availability</legend>
              <label class="flex items-center gap-3 text-sm"><input type="checkbox" id="inStockOnly" class="h-4 w-4 rounded accent-indigo-600"> In stock only</label>
              <label class="flex items-center gap-3 text-sm"><input type="checkbox" id="onSaleOnly" class="h-4 w-4 rounded accent-indigo-600"> On sale</label>
            </fieldset>

            <button type="button" id="clearFilters" class="btn-secondary w-full">Clear all filters</button>
          </div>
        </aside>

        <section aria-labelledby="shopTitle">
          <div class="mb-4 flex flex-wrap items-center gap-2">
            <p id="resultCount" class="mr-2 text-sm text-gray-600 dark:text-gray-400" aria-live="polite"></p>
            <div id="activeChips" class="flex flex-wrap gap-2"></div>
          </div>
          <div id="productGrid" class="grid grid-cols-1 gap-4 min-[420px]:grid-cols-2 md:gap-6 xl:grid-cols-3" aria-busy="true"></div>
          <nav id="pagination" class="mt-10 flex flex-wrap items-center justify-center gap-2" aria-label="Pagination"></nav>
        </section>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="/js/shop.js"></script>
</body>

</html>
